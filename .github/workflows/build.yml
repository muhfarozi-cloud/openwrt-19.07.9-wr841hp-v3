name: Build OpenWrt 19.07.9 - TL-WR841HP v3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "config/**"
      - "patches/**"
      - "scripts/**"
      - "files/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget curl ccache libelf-dev

      - name: Build firmware
        env:
          EXPECTED_KERNEL_ABI: "4.14.267-1-b84a5a29b1d5ae1dc33ccf9ba292ca1d"
          OPENWRT_TAG: "v19.07.9"
          DEVICE_PROFILE: "tplink_tl-wr841hp-v3"
          MAX_IMAGE_KIB: "7808"
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-19.07.9-wr841hp-v3
          path: |
            output/
            build-metadata.txt
          if-no-files-found: warn
          retention-days: 14
